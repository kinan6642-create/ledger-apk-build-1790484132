name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تجهيز Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تثبيت حزم npm
        run: npm install

      - name: صلاحية تنفيذ لملف gradlew
        run: chmod +x android/gradlew

      - name: مزامنة Capacitor
        run: npx cap sync android

      - name: بناء APK (نسخة تجريبية debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: رفع ملف APK كمخرج للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: دفتر-التاجر-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: نشر APK كإصدار (Release) قابل للتحميل مباشرة
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "آخر بناء APK"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
