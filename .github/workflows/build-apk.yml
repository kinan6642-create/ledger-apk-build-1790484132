name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تجهيز Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تثبيت حزم npm
        run: npm install

      - name: صلاحية تنفيذ لملف gradlew
        run: chmod +x android/gradlew

      - name: مزامنة Capacitor
        continue-on-error: true
        run: npx cap sync android 2>&1 | tee cap-sync.log

      - name: بناء APK (نسخة تجريبية debug)
        continue-on-error: true
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: تجميع ملفات السجل
        if: always()
        run: |
          mkdir -p debug-artifacts
          cp cap-sync.log debug-artifacts/ 2>/dev/null || echo "no cap-sync.log" > debug-artifacts/cap-sync.log
          cp gradle-build.log debug-artifacts/ 2>/dev/null || echo "no gradle-build.log" > debug-artifacts/gradle-build.log
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk debug-artifacts/
          fi
          ls -la debug-artifacts

      - name: نشر النتائج والسجلات كإصدار (Release) قابل للتحميل مباشرة
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "آخر بناء"
          files: debug-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
